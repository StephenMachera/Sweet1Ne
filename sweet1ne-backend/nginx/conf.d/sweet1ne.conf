# Redirects everything to HTTPS, except the ACME challenge Certbot needs to
# prove domain ownership.
server {
    listen 80;
    server_name api.sweet1ne.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.sweet1ne.com;

    ssl_certificate /etc/letsencrypt/live/api.sweet1ne.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sweet1ne.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tells browsers to use HTTPS for a year, so a first request over HTTP
    # never happens again after the first visit.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Menu photos and campaign images go through here.
    client_max_body_size 12M;

    location / {
        proxy_pass http://api:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Without this, the app thinks every request arrived over HTTP and
        # builds http:// URLs in emails.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # No point logging the healthcheck — it fires every thirty seconds and
    # would be most of the log file.
    location /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }
}