name: Deploy backend

on:
  push:
    branches: [main]
    # Frontend-only commits shouldn't burn CI minutes rebuilding and
    # redeploying a backend that didn't change.
    paths:
      - "sweet1ne-backend/**"
      - ".github/workflows/deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # The repo now holds both apps — every run/working-directory in this
    # job is relative to the backend's own subfolder, not the checkout root.
    defaults:
      run:
        working-directory: sweet1ne-backend
    # Settings() validates these as required at import time, but the suite
    # never actually calls out to Supabase — get_current_staff is overridden
    # in conftest.py, and the DB tests run against their own local Postgres
    # service below, not this DATABASE_URL. Placeholders only, never real
    # secrets, since nothing here is ever used for a real connection.
    env:
      SUPABASE_URL: "https://placeholder.supabase.co"
      SUPABASE_ANON_KEY: "placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "placeholder"
      DATABASE_URL: "postgresql://postgres:testpass@localhost:5433/sweet1ne_test"
    services:
      # The suite needs a real Postgres — the permission and scoping tests
      # run against actual tables, not mocks.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: sweet1ne_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    # Only builds if the tests passed — a broken image never reaches the
    # registry, let alone the server.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./sweet1ne-backend
          push: true
          # Lowercase — GHCR rejects capitals in the image path even though
          # the GitHub username has them.
          tags: ghcr.io/stephenmachera/sweet1ne-api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Pulls the new image and recreates only the api container —
          # nginx and certbot keep running untouched.
          script: |
            cd /home/${{ secrets.VPS_USER }}/sweet1ne-backend
            docker compose pull api
            docker compose up -d api
            docker image prune -f